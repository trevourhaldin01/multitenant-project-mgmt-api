services:
  postgres:
    image: postgres:16-alpine
    environment: 
      POSTGRES_DB: saas_api
      POSTGRS_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: